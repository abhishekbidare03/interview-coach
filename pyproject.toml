[project]
name = "interview-coach"
version = "0.1.0"
description = "Local AI interview coach — voice-driven, fully offline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "numpy>=1.26,<2.3",
    "soundfile>=0.12",
    "httpx>=0.27",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.3.0",
    "silero-vad>=5.1",
    "torch>=2.4",
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

# Torch is CPU-only on purpose: Silero VAD runs on CPU (plan.md §3 VRAM budget).
# GPU work goes to CTranslate2 (STT) and Ollama (LLM); neither uses torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
